name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  challenge-probe:
    name: challenge probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        working-directory: spikes/simplewebauthn
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select probe runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: spikes/simplewebauthn/.node-version
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci
      - name: Check published dependency advisories
        run: npm audit
      - name: Run synthetic challenge tests
        run: npm test
      - name: Verify candidate signed envelope vectors
        run: node envelope-vector-test.mjs
      - name: Build real-helper test driver with pinned Rust
        working-directory: .
        run: cargo build -p vollmacht-helper-launcher --bin vollmacht-helper-launcher --example real-helper --release --locked
      - name: Exercise real verifier through Rust and native launcher
        run: npm run test:helper-e2e
        env:
          VOLLMACHT_TEST_DRIVER: ${{ github.workspace }}/target/release/examples/real-helper
          VOLLMACHT_TEST_LAUNCHER: ${{ github.workspace }}/target/release/vollmacht-helper-launcher
      - name: Report developer preflight, inventory and process latency
        run: python3 ../helper-protocol/dev.py measure "$(command -v node)" "$VOLLMACHT_TEST_LAUNCHER" "$VOLLMACHT_TEST_DRIVER"
        env:
          VOLLMACHT_TEST_DRIVER: ${{ github.workspace }}/target/release/examples/real-helper
          VOLLMACHT_TEST_LAUNCHER: ${{ github.workspace }}/target/release/vollmacht-helper-launcher
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Select pinned Node runtime for workspace browser tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: spikes/simplewebauthn/.node-version
          package-manager-cache: false
      - name: Check workspace
        run: python3 scripts/check.py
      - name: Check compile-only Apple key profiles
        if: runner.os == 'macOS'
        run: python3 spikes/macos-key/swift/run.py
  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install pinned checker and audit dependencies
        run: python3 scripts/dependencies.py install
