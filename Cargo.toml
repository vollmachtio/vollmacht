[workspace]
members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/vollmachtio/vollmacht"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
overflow-checks = true
