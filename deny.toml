[advisories]
ignore = []

[licenses]
include-dev = true
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "MPL-2.0"]
confidence-threshold = 0.9

# Axum's router includes httprouter-derived code. Retain both upstream notices.
[[licenses.exceptions]]
name = "matchit"
version = "=0.8.4"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "subtle"
version = "=2.6.1"
allow = ["BSD-3-Clause"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
